# docker-compose override — adds the gateway service to the main stack.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gateway.yml up -d

services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    restart: unless-stopped
    environment:
      GATEWAY_BRIDGE_URL: ${GATEWAY_BRIDGE_URL:-http://bridge:8000}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
    depends_on:
      bridge:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [internal, external]
