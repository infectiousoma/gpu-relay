name: llm-infrastructure

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-llm_infra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm} -d ${POSTGRES_DB:-llm_infra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    # GPU access on the host. Comment out if running CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [internal]

  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.bridge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      MOCK_PROVIDERS: ${MOCK_PROVIDERS:-}
    volumes:
      - ./config/tiers.yaml:/app/config/tiers.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "${BRIDGE_PORT:-8000}:8000"
    networks: [internal, external]

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      bridge:
        condition: service_started
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    networks: [internal, external]

  ccr:
    build:
      context: .
      dockerfile: docker/Dockerfile.ccr
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"
    volumes:
      - ./config/ccr-config.json:/root/.claude-code-router/config.json:ro
    environment:
      CCR_BRIDGE_API_KEY: ${CCR_BRIDGE_API_KEY}
    depends_on:
      bridge:
        condition: service_started
    ports:
      - "${CCR_PORT:-3456}:3456"
    networks: [internal, external]

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PIPELINES_DIR: /app/pipelines
      PIPELINES_API_KEY: ${PIPELINES_API_KEY:-change-me-pipelines-secret}
    volumes:
      - ./pipelines:/app/pipelines
    ports:
      - "${PIPELINES_PORT:-9099}:9099"
    networks: [internal, external]

  workspace-tools:
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace-tools
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      WORKSPACE_ROOT: /workspace
      MAX_EXEC_TIMEOUT: ${WORKSPACE_EXEC_TIMEOUT:-30}
      MAX_FILE_SIZE_MB: ${WORKSPACE_MAX_FILE_MB:-10}
    volumes:
      - ./workspace_data:/workspace
    ports:
      - "${WORKSPACE_TOOLS_PORT:-7000}:7000"
    networks: [internal, external]

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY:-change-me}
      # Bridge as primary OpenAI-compatible backend (all GPU/API providers)
      OPENAI_API_BASE_URL: ${OPENWEBUI_BRIDGE_URL:-http://bridge:8000}/v1
      OPENAI_API_KEY: ${OPENWEBUI_BRIDGE_API_KEY:-}
      ENABLE_OLLAMA_API: "false"
      # Anthropic native integration (Claude models direct, no bridge)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Image generation (set ENGINE to openai for DALL-E via bridge, or comfyui/automatic1111)
      ENABLE_IMAGE_GENERATION: ${ENABLE_IMAGE_GENERATION:-false}
      IMAGE_GENERATION_ENGINE: ${IMAGE_GENERATION_ENGINE:-openai}
      IMAGES_OPENAI_API_BASE_URL: ${IMAGES_OPENAI_API_BASE_URL:-http://bridge:8000/v1}
      IMAGES_OPENAI_API_KEY: ${IMAGES_OPENAI_API_KEY:-}
      # Workspace tools service URL (used by the Tool shim)
      WORKSPACE_TOOLS_URL: http://workspace-tools:7000
      USER_PERMISSIONS_WORKSPACE_CONNECTIONS_ACCESS: "true"
      ENABLE_DIRECT_CONNECTIONS: "true"
    volumes:
      - openwebui_data:/app/backend/data
      - ./workspace_data:/workspace
    depends_on:
      bridge:
        condition: service_started
      workspace-tools:
        condition: service_started
    ports:
      - "3000:8080"
    networks: [internal, external]

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  openwebui_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
