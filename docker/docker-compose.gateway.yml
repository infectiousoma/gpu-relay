name: llm-gateway

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    restart: unless-stopped
    environment:
      GATEWAY_BRIDGE_URL: ${GATEWAY_BRIDGE_URL}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
